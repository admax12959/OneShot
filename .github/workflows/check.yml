name: Check prototype artifacts

# Browser-free checks only (see README "Checks"). No secrets, no deploy, read-only token.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tool versions
        run: |
          node --version
          python3 --version
      - name: Check
        run: node scripts/check.mjs
      - name: Check tests
        run: node --test scripts/test/*.test.mjs
